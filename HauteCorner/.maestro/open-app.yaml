# Starts the app clean, so every run begins on Home with an empty cart.
# Release builds run as they are. For a development build, pass -e METRO_PORT=<port>
# to load the JavaScript from Metro, though its dev tools can get in the way of taps.
appId: com.hautecorner.app
---
- launchApp:
    clearState: true
- runFlow:
    when:
      true: ${METRO_PORT}
    commands:
      - openLink: exp+hautecorner://expo-development-client/?url=http%3A%2F%2Flocalhost%3A${METRO_PORT}
      - runFlow:
          when:
            visible: Open
          commands:
            - tapOn: Open
      # On Android the link can arrive before the dev launcher is ready, which
      # leaves it on its list of servers. Pick the Metro server from the list.
      - extendedWaitUntil:
          visible: Wish List
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: Development servers
          commands:
            - tapOn: .*:${METRO_PORT}
# The dev launcher has a Home tab too, so wait for a tab only the app has.
- extendedWaitUntil:
    visible: Wish List
    timeout: 120000
- runFlow:
    when:
      true: ${METRO_PORT}
    commands:
      # The dev menu's first-run popup appears shortly after the app loads.
      - extendedWaitUntil:
          visible: Continue
          timeout: 8000
          optional: true
      - runFlow:
          when:
            visible: Continue
          commands:
            - tapOn: Continue
- waitForAnimationToEnd:
    timeout: 3000
