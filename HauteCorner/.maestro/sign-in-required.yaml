# Phase 3: browsing and liking need no account, but the profile, selling and
# checkout ask the shopper to sign in.
# Needs the API running with seed data. It does not press the Google or Apple
# buttons, because a real sign-in needs an account with them.
appId: com.hautecorner.app
---
- runFlow: open-app.yaml

# The profile asks to sign in, and opens the sign-in screens.
- tapOn: Profile
- extendedWaitUntil:
    visible: Your profile
    timeout: 10000
- tapOn: Sign in
- extendedWaitUntil:
    visible: Sign in to HauteCorner
    timeout: 10000
- assertVisible: Sign in with Google
- assertVisible: Continue with email
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: Sign in with Apple
- takeScreenshot: 01-sign-in
- tapOn: Close
- extendedWaitUntil:
    visible: Your profile
    timeout: 10000

# The wish list works without an account. Selling asks to sign in.
- tapOn: Wish List
- extendedWaitUntil:
    visible: Nothing saved yet
    timeout: 10000
- tapOn: Add Product
- extendedWaitUntil:
    visible: Sell on HauteCorner
    timeout: 10000
- takeScreenshot: 02-sell

# Checkout opens sign-in, while adding to the cart does not need it.
- tapOn: Home
- extendedWaitUntil:
    visible: Graphic tee and joggers set.*
    timeout: 30000
- tapOn: Graphic tee and joggers set.*
- extendedWaitUntil:
    visible: Sold by Westlands Denim Co.*
    timeout: 15000
- scrollUntilVisible:
    element: Add to cart
    direction: DOWN
- tapOn: Add to cart
- runFlow:
    when:
      notVisible: My cart
    commands:
      - tapOn: More
- tapOn: My cart
- extendedWaitUntil:
    visible: Checkout
    timeout: 10000
- tapOn: Checkout
- extendedWaitUntil:
    visible: Sign in to HauteCorner
    timeout: 10000
- takeScreenshot: 03-checkout-sign-in
- tapOn: Close
