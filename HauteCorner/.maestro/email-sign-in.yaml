# Signs in with an existing email account, from wherever the app is.
#   - runFlow: { file: email-sign-in.yaml, env: { EMAIL: ..., PASSWORD: ... } }
appId: com.hautecorner.app
---
- tapOn: Profile
- tapOn: Sign in
- extendedWaitUntil:
    visible: Continue with email
    timeout: 10000
- tapOn: Continue with email
- extendedWaitUntil:
    visible: Your password
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: you@example.com
- inputText: ${EMAIL}
- tapOn: Your password
- inputText: ${PASSWORD}
- tapOn:
    text: Sign in
    below: Password
# iOS offers to save the password.
- extendedWaitUntil:
    visible: Not Now
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: Not Now
    commands:
      - tapOn: Not Now
- extendedWaitUntil:
    visible: Sign in with
    timeout: 15000
